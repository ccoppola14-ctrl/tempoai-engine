services:
  - type: web
    name: tempoai-engine
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        value: file:/data/tempoai.db
      - key: SQUARE_APP_ID
        sync: false
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: SQUARE_ENVIRONMENT
        value: sandbox
      - key: PORT
        value: "3001"
      - key: DEMO_MODE
        value: "false"
      - key: NODE_ENV
        value: production
    disk:
      name: tempoai-data
      mountPath: /data
      sizeGB: 1
